name: Docker Hub Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: chijie

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ahaduoduoduo/ChiJie
            org.opencontainers.image.description=Chijie HTTP-to-proxy gateway
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-cn211:
    name: Deploy CN211
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Configure restricted SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.CN211_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.CN211_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/chijie-deploy"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/chijie-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Pull image and deploy CHIJIE
        run: |
          ssh \
            -i "$HOME/.ssh/chijie-deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${{ vars.CN211_PORT }}" \
            "${{ vars.CN211_USER }}@${{ vars.CN211_HOST }}"

      - name: Remove deployment key
        if: always()
        run: rm -f "$HOME/.ssh/chijie-deploy"
