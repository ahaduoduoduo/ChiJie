<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Chijie</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Pure neutrals — no hue */
    --bg-0: #0a0a0a;
    --bg-1: #0f0f0f;
    --bg-2: #141414;
    --bg-3: #1a1a1a;
    --bg-4: #222222;

    --line:        rgba(255,255,255,0.05);
    --line-2:      rgba(255,255,255,0.08);
    --line-3:      rgba(255,255,255,0.12);

    --fg-0: #fafafa;
    --fg-1: #c9c9c9;
    --fg-2: #8a8a8a;
    --fg-3: #5a5a5a;
    --fg-4: #3a3a3a;

    /* Signal colors — desaturated, dark-bg friendly */
    --sig-ok:    #6ec77c;
    --sig-warn:  #d6a85f;
    --sig-err:   #e07670;
    --sig-info:  #7aa6d6;

    --radius: 10px;
    --radius-sm: 6px;
    --radius-xs: 4px;

    --shadow-sm: 0 1px 0 rgba(255,255,255,0.03) inset;
    --shadow-md: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.5);
    --shadow-lg: 0 1px 0 rgba(255,255,255,0.06) inset, 0 32px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);

    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--fg-0); }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: 'cv11' 1;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'zero' 1; }

  ::selection { background: rgba(255,255,255,0.18); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }

  /* Ambient glow on body for depth */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(800px 400px at 80% -10%, rgba(255,255,255,0.025), transparent 60%),
      radial-gradient(600px 300px at 0% 100%, rgba(255,255,255,0.015), transparent 60%);
    z-index: 0;
  }

  /* App shell */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }

  /* Sidebar */
  .sidebar {
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    background: var(--bg-0);
  }
  .brand {
    padding: 22px 22px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: radial-gradient(circle at 30% 25%, #fafafa, #888 60%, #444);
    box-shadow: 0 0 16px rgba(255,255,255,0.18), inset 0 0 0 0.5px rgba(255,255,255,0.4);
    position: relative;
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 6px;
    border-radius: 50%;
    background: var(--bg-0);
    box-shadow: inset 0 0 6px rgba(0,0,0,0.7);
  }
  .brand-name {
    font-weight: 500; letter-spacing: -0.012em; font-size: 14px;
  }

  .nav {
    flex: 1; padding: 4px 12px; overflow-y: auto;
  }
  .nav-section-label {
    font-size: 10px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase;
    padding: 18px 8px 8px;
    font-weight: 500;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; margin: 1px 0;
    border-radius: var(--radius-xs);
    color: var(--fg-2); cursor: pointer;
    font-size: 13px;
    font-weight: 450;
    user-select: none;
    transition: color 200ms var(--ease), background 200ms var(--ease);
    position: relative;
  }
  .nav-item:hover { color: var(--fg-0); }
  .nav-item.active {
    color: var(--fg-0);
    background: rgba(255,255,255,0.04);
  }
  .nav-item svg { width: 14px; height: 14px; opacity: 0.7; }
  .nav-item.active svg { opacity: 1; }
  .nav-item .badge-count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--fg-3);
  }

  .sidebar-foot {
    padding: 16px 22px 22px;
    display: flex; align-items: center; gap: 10px;
    font-size: 12px;
    border-top: 1px solid var(--line);
  }
  .health-pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: #fafafa;
    box-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 0 0 rgba(255,255,255,0.3);
    animation: pulse 2.6s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 0 0 rgba(255,255,255,0.3); }
    50% { box-shadow: 0 0 12px rgba(255,255,255,0.8), 0 0 0 6px rgba(255,255,255,0); }
  }

  /* Main */
  .main { background: var(--bg-0); min-width: 0; }
  .topbar {
    height: 56px;
    display: flex; align-items: center; gap: 16px;
    padding: 0 32px;
    background: rgba(10,10,10,0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--line);
  }
  .crumbs { color: var(--fg-2); font-size: 13px; display: flex; align-items: center; gap: 8px; font-weight: 450; }
  .crumbs .sep { color: var(--fg-4); }
  .crumbs .now { color: var(--fg-0); font-weight: 500; }
  .topbar-spacer { flex: 1; }
  .topbar-meta { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--fg-3); }
  .topbar-user {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--fg-1);
  }
  .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(180deg, #2a2a2a, #111);
    display: grid; place-items: center; font-size: 9px; font-weight: 600;
    border: 1px solid var(--line-2);
    color: var(--fg-1);
  }

  .page { padding: 36px 48px 96px; width: 100%; max-width: none; }
  @media (max-width: 1280px) { .page { padding: 32px 32px 80px; } }

  /* Page header — generous, restrained */
  .page-h {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 32px; margin-bottom: 36px;
  }
  .page-h h1 {
    margin: 0; font-size: 28px; font-weight: 500; letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .page-h p { margin: 8px 0 0; color: var(--fg-2); font-size: 13px; max-width: 520px; line-height: 1.55; }
  .page-h-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

  /* Buttons — soft and refined */
  .btn {
    height: 32px; padding: 0 14px;
    border: 1px solid var(--line-2);
    background: var(--bg-2);
    color: var(--fg-1);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 450;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit;
    transition: all 200ms var(--ease);
    box-shadow: var(--shadow-sm);
  }
  .btn:hover {
    color: var(--fg-0);
    border-color: var(--line-3);
    background: var(--bg-3);
  }
  .btn:active { transform: translateY(0.5px); }
  .btn svg { width: 13px; height: 13px; opacity: 0.8; }
  .btn.primary {
    background: linear-gradient(180deg, #f4f4f4, #d8d8d8);
    color: #111;
    border-color: rgba(255,255,255,0.5);
    font-weight: 500;
    box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 0 0 1px rgba(0,0,0,0.04), 0 4px 16px rgba(255,255,255,0.06);
  }
  .btn.primary:hover {
    background: linear-gradient(180deg, #ffffff, #e4e4e4);
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 0 0 1px rgba(0,0,0,0.04), 0 6px 24px rgba(255,255,255,0.12);
  }
  .btn.primary svg { opacity: 1; }
  .btn.danger { color: var(--fg-0); }
  .btn.danger:hover { background: rgba(255,255,255,0.06); border-color: var(--line-3); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: rgba(255,255,255,0.04); border-color: var(--line-2); }
  .btn.sm { height: 26px; padding: 0 10px; font-size: 11.5px; }
  .btn:disabled, .btn-icon:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }
  .btn-icon {
    width: 28px; height: 28px;
    display: inline-grid; place-items: center;
    border: 1px solid transparent; background: transparent;
    color: var(--fg-2); border-radius: var(--radius-xs);
    cursor: pointer;
    transition: all 160ms var(--ease);
  }
  .btn-icon:hover { background: rgba(255,255,255,0.05); color: var(--fg-0); border-color: var(--line-2); }
  .btn-icon svg { width: 13px; height: 13px; }

  /* Cards — minimal borders, subtle inset highlight */
  .card {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .card-h {
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .card-h.bordered { border-bottom: 1px solid var(--line); }
  .card-h h3 { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: -0.005em; color: var(--fg-0); }
  .card-h .sub { color: var(--fg-3); font-size: 12px; font-weight: 400; }
  .card-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .card-body { padding: 20px; }
  .card-pad-0 .card-body { padding: 0; }

  /* Stat — large soft numbers, mono */
  .stat {
    padding: 24px 24px;
    border-right: 1px solid var(--line);
  }
  .stat:last-child { border-right: none; }
  .stat-label {
    color: var(--fg-3); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
    font-weight: 500;
  }
  .stat-value {
    margin-top: 14px; font-size: 32px; font-weight: 400; letter-spacing: -0.025em;
    color: var(--fg-0);
    line-height: 1;
    font-feature-settings: 'tnum' 1;
  }
  .stat-value .unit { font-size: 13px; color: var(--fg-3); margin-left: 4px; font-weight: 400; }
  .stat-delta { margin-top: 10px; font-size: 11.5px; color: var(--fg-3); display: flex; align-items: center; gap: 4px; }
  .stat-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 24px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  /* Pill — single shape, only visual variation is dot color */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 22px; padding: 0 9px;
    border-radius: 99px;
    font-size: 11.5px;
    font-family: 'JetBrains Mono', monospace;
    background: rgba(255,255,255,0.04);
    color: var(--fg-1);
    border: 1px solid var(--line-2);
    line-height: 1;
    white-space: nowrap;
    font-weight: 450;
  }
  .pill.region { letter-spacing: 0.02em; }
  .pill.res {
    color: var(--fg-0);
    background: rgba(255,255,255,0.08);
    border-color: var(--line-3);
  }
  .pill.res::before {
    content: ""; width: 4px; height: 8px; border-radius: 1px;
    background: var(--fg-0);
    margin-right: 2px;
  }
  .premium-dot {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #f5d782;
    box-shadow: 0 0 9px rgba(245, 215, 130, 0.42);
    flex: 0 0 auto;
    vertical-align: middle;
  }
  .premium-dot.with-label {
    width: auto;
    height: 18px;
    background: transparent;
    box-shadow: none;
  }
  .premium-dot.with-label::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #f5d782;
    box-shadow: 0 0 9px rgba(245, 215, 130, 0.42);
  }
  .premium-dot span {
    color: #f5d782;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
  }
  .pill.tag {
    background: transparent; color: var(--fg-3);
    font-family: 'Inter', sans-serif; font-size: 10.5px;
    height: 20px; padding: 0 8px;
    text-transform: lowercase; letter-spacing: 0;
    font-weight: 450;
  }

  /* Status dot — signal color */
  .dot {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; color: var(--fg-2);
  }
  .dot::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--fg-3);
    flex-shrink: 0;
  }
  .dot.alive { color: var(--sig-ok); }
  .dot.alive::before {
    background: var(--sig-ok);
    box-shadow: 0 0 8px rgba(110, 199, 124, 0.55);
  }
  .dot.flaky { color: var(--sig-warn); }
  .dot.flaky::before {
    background: var(--sig-warn);
    box-shadow: 0 0 6px rgba(214, 168, 95, 0.45);
  }
  .dot.down { color: var(--sig-err); }
  .dot.down::before {
    background: var(--sig-err);
    box-shadow: 0 0 6px rgba(224, 118, 112, 0.4);
  }
  .dot.disabled { color: var(--fg-3); }
  .dot.disabled::before {
    background: transparent;
    border: 1px solid var(--fg-3);
    width: 6px; height: 6px;
    box-shadow: none;
  }

  /* Tables — minimal lines, rest in white space */
  .table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .table th {
    text-align: left; font-weight: 500; color: var(--fg-3);
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .table td {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    color: var(--fg-1);
    vertical-align: middle;
  }
  .table tbody tr { transition: background 160ms var(--ease); }
  .table tbody tr:hover { background: rgba(255,255,255,0.025); }
  .table tbody tr:last-child td { border-bottom: none; }
  .table .num, .table .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: 'tnum' 1; }
  .table .num { text-align: right; }

  /* Inputs */
  .input, .select, textarea.input {
    height: 32px; padding: 0 12px;
    background: var(--bg-2);
    border: 1px solid var(--line-2);
    color: var(--fg-0);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-family: inherit;
    width: 100%;
    transition: all 160ms var(--ease);
  }
  textarea.input { padding: 10px 12px; height: auto; min-height: 80px; resize: vertical; line-height: 1.55; }
  .input:focus, .select:focus, textarea.input:focus {
    outline: none; border-color: var(--line-3);
    background: var(--bg-3);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
  }
  .input::placeholder { color: var(--fg-4); }
  .input.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field-label { font-size: 11.5px; color: var(--fg-2); font-weight: 450; }
  .field-hint { font-size: 11.5px; color: var(--fg-3); line-height: 1.5; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* Toggle */
  .toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .toggle-track {
    width: 28px; height: 16px; border-radius: 99px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line-2);
    position: relative; transition: 200ms var(--ease);
  }
  .toggle-track::after {
    content: ""; position: absolute; top: 1px; left: 1px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--fg-2);
    transition: 200ms var(--ease);
  }
  .toggle.on .toggle-track {
    background: rgba(255,255,255,0.95);
    border-color: rgba(255,255,255,0.6);
  }
  .toggle.on .toggle-track::after {
    left: 13px; background: #111;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .toggle-label { font-size: 12.5px; color: var(--fg-1); }

  /* Segmented */
  .seg {
    display: inline-flex;
    background: var(--bg-2);
    border: 1px solid var(--line-2);
    border-radius: 99px;
    padding: 3px;
  }
  .seg button {
    height: 24px; padding: 0 12px; border: none; background: transparent;
    color: var(--fg-3); font-size: 11.5px; cursor: pointer; border-radius: 99px;
    font-family: inherit; font-weight: 450;
    transition: all 200ms var(--ease);
  }
  .seg button.on {
    background: rgba(255,255,255,0.07);
    color: var(--fg-0);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
  }
  .seg button:hover:not(.on) { color: var(--fg-1); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: grid; place-items: center;
    z-index: 100;
    animation: fade 180ms var(--ease);
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg-1);
    border: 1px solid var(--line-2);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    width: min(520px, 92vw);
    max-height: 86vh;
    display: flex; flex-direction: column;
    animation: rise 280ms var(--ease);
  }
  .modal.wide {
    width: min(760px, 92vw);
  }
  @keyframes rise {
    from { transform: translateY(12px) scale(0.98); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  .modal-h {
    padding: 22px 24px 16px;
    display: flex; align-items: center;
  }
  .modal-h h2 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: -0.012em; }
  .modal-body { padding: 8px 24px 8px; overflow-y: auto; }
  .modal-foot {
    padding: 18px 24px 22px;
    display: flex; justify-content: flex-end; gap: 8px;
  }

  /* Drawer */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px); z-index: 90;
    animation: fade 200ms var(--ease);
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(480px, 92vw); background: var(--bg-1);
    max-width: 100vw;
    border-left: 1px solid var(--line-2);
    z-index: 91;
    display: flex; flex-direction: column;
    animation: slide 320ms var(--ease);
    box-shadow: -32px 0 64px rgba(0,0,0,0.4);
    overflow-x: hidden;
  }
  @keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .drawer-h { padding: 22px 28px; display: flex; align-items: center; gap: 12px; }
  .drawer-body { padding: 4px 28px 28px; overflow-y: auto; overflow-x: hidden; flex: 1; min-width: 0; }
  .kv { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 10px 20px; align-items: center; min-width: 0; }
  .kv .k { color: var(--fg-3); font-size: 12px; font-weight: 450; }
  .kv .v { color: var(--fg-0); font-size: 12.5px; min-width: 0; }
  .request-detail { max-width: 100%; min-width: 0; overflow: hidden; }
  .request-detail .kv .v {
    overflow-wrap: anywhere;
    word-break: break-word;
    line-height: 1.5;
  }
	  .request-replay {
	    max-width: 100%;
	    min-width: 0;
	    white-space: pre-wrap;
	    overflow-wrap: anywhere;
	    word-break: break-word;
	  }
	  .url-rule-builder {
	    margin-top: 22px;
	    padding: 14px;
	    border: 1px solid var(--line-2);
	    border-radius: 8px;
	    background: rgba(255,255,255,0.025);
	    overflow: hidden;
	  }
	  .url-rule-head {
	    display: flex;
	    align-items: flex-start;

  /* Latency — thresholded color */
  .lat {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px;
    color: var(--fg-1);
  }
  .lat-track { width: 36px; height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .lat-fill { height: 100%; border-radius: 2px; transition: width 240ms var(--ease); }
  .lat .ms { color: var(--fg-3); }
  .lat.fast { color: var(--sig-ok); }
  .lat.fast .lat-fill { background: var(--sig-ok); box-shadow: 0 0 4px rgba(110,199,124,0.4); }
  .lat.fast .ms { color: var(--sig-ok); opacity: 0.7; }
  .lat.mid { color: var(--fg-1); }
  .lat.mid .lat-fill { background: var(--fg-1); }
  .lat.slow { color: var(--sig-warn); }
  .lat.slow .lat-fill { background: var(--sig-warn); }
  .lat.slow .ms { color: var(--sig-warn); opacity: 0.7; }
  .lat.bad { color: var(--sig-err); }
  .lat.bad .lat-fill { background: var(--sig-err); }
  .lat.bad .ms { color: var(--sig-err); opacity: 0.7; }
